<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bangladesh Guardian PhotoCard Generator</title>
    <meta name="description" content="A web based Application that uses Bangladesh Guardian's internal API to fetch Latest news posts and generate Photocards automatically." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Abdullah Bari Asif" />
    <link rel="icon" type="image/svg+xml" href="/Logoicon.svg" />

    <meta property="og:title" content="Bangladesh Guardian PhotoCard Generator" />
    <meta property="og:description" content="A web based Application that uses Bangladesh Guardian's internal API to fetch Latest news posts and generate Photocards automatically." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Logoicon.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bangladesh Guardian PhotoCard Generator" />
    <meta name="twitter:description" content="A web based Application that uses Bangladesh Guardian's internal API to fetch Latest news posts and generate Photocards automatically." />
    <meta name="twitter:image" content="/Logoicon.svg" />

    <script>
      // Zoom Lock
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '0' || e.key === '+')) {
          e.preventDefault();
        }
      });

      // Copy Lock
      document.addEventListener('copy', (e) => {
        e.clipboardData.setData('text/plain', 'You can’t copy Bro!');
        e.preventDefault();
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
