name: Build and Package

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create deployment config files
        run: |
          # Apache .htaccess for MPA 404
          echo 'ErrorDocument 404 /404.html' > dist/.htaccess

          # Netlify _redirects for MPA 404
          echo '/* /404.html 404' > dist/_redirects

      - name: Create package
        run: |
          cd dist
          zip -r ../dist.zip .

      - name: Get current date
        id: date
        run: echo "VERSION=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: ${{ steps.date.outputs.VERSION }}
          name: Release ${{ steps.date.outputs.VERSION }}
          files: dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist.zip
